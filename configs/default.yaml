seed: 2024
model:
  fusion:
    name: xattn
    n_layers: 2
    n_heads: 4
    attn_pdrop: 0.0
    proj_pdrop: 0.1
    path_pdrop: 0.1
    xattn_mode: affine
  cls_head:
    name: cls
    n_layers: 2
  reg_head:
    name: reg
    n_layers: 2
  future_cls_head:
    name: cls
    n_layers: 2
  future_reg_head:
    name: reg
    num_fpn_levels: 1
    n_layers: 2
    out_dim: 1
    relu: false
  survival_head:
    hidden_dim: 256
    n_layers: 2
    kernel_size: 3
    dropout: 0.1
    prior_start: 0.01
    prior_end: 0.01
    prior_cure: 0.1
    enable_cure: true
    enable_state: true
  variant: survvtg
  future_prediction: true
train:
  amp: true
  amp_dtype: bfloat16
  tf32: true
  center_sampling: radius
  center_sampling_radius: 1.5
  eval: false
  eval_epoch_interval: 1
  survival:
    enabled: true
    weight: 1.0
    normalize_by_risk: true
    components:
      start: 1.0
      end: 1.0
      cure: 0.5
      state: 0.5
      monotonic: 0.05
    boundary_objective: hazard
eval:
  data:
    split: test
  max_vid_len: 9216
  ranks:
  - 1
  - 5
  iou_threshs:
  - 0.3
  - 0.5
  - 0.7
  pre_nms_topk: 200
  pre_nms_thresh: 0.001
  future_topk: 10
  seg_len_thresh: 0.1
  cure_gate: true
  ckpt: null
  protocol: standard
  calibration_file: null
  explicit_refusal: false
  ece_bins: 15
  save_predictions: true
  save_curves: false
  refusal_threshold: 0.5
  threshold_source: paper_validation_selected
log:
  log_interval: 100
  checkpoint_epochs:
  - 13
  - 14
  - 15
  - 16
_resume: null
_pretrained: null
_distributed: false
_root: results
