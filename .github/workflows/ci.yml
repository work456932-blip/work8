name: tests

on:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.3.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest==8.3.2 omegaconf==2.3.0 numpy==1.26.4 h5py==3.11.0
      - name: Static validation
        run: |
          python -m compileall -q train.py evaluate.py libs tools tests
          bash -n scripts/*.sh
      - name: Unit tests
        run: pytest -q
